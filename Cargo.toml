[package]
name = "sgp30-exporter"
version = "0.1.29"
edition = "2024"
authors = ["Andreas Weiden <andreas.weiden@gmail.com>"]
readme = "README.md"
repository = "https://github.com/graipher/sgp30-exporter"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[dependencies]
compile-time = "0.3.0"
embedded-hal = "1.0.0"
linux-embedded-hal = "0.4.0"
prometheus-parse = { git = "https://github.com/ccakes/prometheus-parse-rs.git", tag = "v0.2.5" }
prometheus_exporter = "0.8.5"
reqwest = { version = "0.13.1", features = [
    "json",
    "rustls",
], default-features = false }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
sgp30 = "1.0.0"
sysinfo = { version = "0.38.0" }
tokio = { version = "1.43.1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "signal",
] }
